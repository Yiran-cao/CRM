{% extends "base.html" %}
{% block title %}工作台 - CRM 系统{% endblock %}
{% block content %}
<div class="page">
    <div class="page-header">
        <h2>📋 工作台</h2>
    </div>
    <div class="page-body">
        <div class="card-grid" id="statCards">
            <div class="stat-card accent-blue"><div class="stat-label">📁 我的项目</div><div class="stat-value" id="statTotal">--</div></div>
            <div class="stat-card accent-green"><div class="stat-label">🎯 预测结单</div><div class="stat-value" id="statPredicted">--</div></div>
            <div class="stat-card accent-teal"><div class="stat-label">✅ 本年度已成交</div><div class="stat-value" id="statDelivered">--</div></div>
            <div class="stat-card accent-red"><div class="stat-label">🚫 本年度无效客户</div><div class="stat-value" id="statLost">--</div></div>
            <div class="stat-card accent-amber"><div class="stat-label">⭐ 当期积分</div><div class="stat-value" id="statPoints">--</div></div>
            <div class="stat-card accent-purple"><div class="stat-label">📅 当前周期</div><div class="stat-value" id="statPeriod">--</div></div>
            <div class="stat-card accent-dynamic" id="statusCard"><div class="stat-label">🔒 账号状态</div><div class="stat-value" id="statStatus">--</div></div>
        </div>
        <div class="quick-actions">
            <button class="action-btn primary" onclick="location.href='/projects'">➕ 新建项目</button>
            <button class="action-btn" onclick="location.href='/projects'">📁 我的项目</button>
            <button class="action-btn" onclick="location.href='/reports'">⭐ 积分考核</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>
{% endblock %}
{% block extra_js %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
