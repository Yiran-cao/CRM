# Render.com 蓝图配置（blueprint）
# 在 Render 中新建 Blueprint 并指向该文件即可一键部署
services:
  - type: web
    name: crm-system
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: admin123
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: crm-db
    plan: free
